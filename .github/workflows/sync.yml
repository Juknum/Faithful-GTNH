name: Sync Vanilla 32x Assets

on:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 2 AM UTC
  workflow_dispatch:    # Allows manual trigger

permissions:
  contents: write  # Required to push changes to the repository

jobs:
  sync-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to commit and push changes

      - name: Set up Git
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone external repo branch
        run: |
          TEMP_DIR=$(mktemp -d)
          git clone --branch 1.7.10 --single-branch https://github.com/Faithful-Resource-Pack/Faithful-32x-Java "$TEMP_DIR"
          if [ -d "$TEMP_DIR/assets" ]; then
            cp -r "$TEMP_DIR/assets" ./ 
            echo "Assets directory copied."
          else
            echo "No assets directory found in branch."
          fi
          rm -rf "$TEMP_DIR"

      - name: Commit and push changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add assets
            git commit -m "chore: sync assets from Faithful 32x 1.7.10"
            git push
          else
            echo "No changes to commit."
          fi
